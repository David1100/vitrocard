# Blueprint de Render — backend Vitro (Express + Prisma → Supabase Postgres)
# Deploy: Render Dashboard → New → Blueprint → elegir este repo.
# DATABASE_URL y CORS_ORIGIN se completan a mano (datos de Supabase y Vercel).
services:
  - type: web
    name: vitro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
